<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <a class="navbar-brand" href="#">Text Summarizer</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#">Home</a>
                </li>
                
                <li class="nav-item">
                    <a class="nav-link" href="#">Features</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">About</a>
                </li>
            </ul>
        </div>
    </nav>
    
    <!-- Main Content -->
    <div class="container mt-5">
        <h1 class="text-center mb-4">Text Summarizer</h1>
        
        <div class="card shadow-sm p-4">
            <form method="POST">
                <div class="form-group">
                    <label for="text">Enter text to summarize:</label>
                    <textarea class="form-control" name="text" id="text" rows="8" required>{{ request.form.get('text', '') }}</textarea>
                </div>
                
                <div class="form-group">
                    <label for="num_sentences">Number of sentences in summary:</label>
                    <input type="number" class="form-control" name="num_sentences" id="num_sentences" value="{{ request.form.get('num_sentences', 3) }}" min="1">
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Summarize</button>
            </form>

            {% if summary %}
            <div class="mt-4">
                <h2>Summary:</h2>
                <p class="bg-light p-3 rounded border">{{ summary }}</p>
            </div>
            {% endif %}
        </div>
    </div>

    <!-- Bootstrap JS and dependencies (optional, for advanced components) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
